---
layout: default
---

<section class="intro post-page__head">

  <div class="wrap">

    <time class="post-page__date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    <h1 class="post-page__title">{{ page.title }}</h1>

  </div>

</section>

<section class="single post-page__body">

  <div class="wrap">

    {{ page.content }}

  </div>

</section>
